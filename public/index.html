<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Still — Quiet Recovery</title>
  <meta name="description" content="A quiet, on-device recovery and consistency coach: sleep, recovery, training, protein, breathwork.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Still">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <!-- fetch the whole module graph in parallel instead of a request chain -->
  <link rel="modulepreload" href="/js/app.js">
  <link rel="modulepreload" href="/js/calc.js">
  <link rel="modulepreload" href="/js/data.js">
  <link rel="modulepreload" href="/js/html.js">
  <link rel="modulepreload" href="/js/store.js">
  <link rel="modulepreload" href="/js/ui.js">
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <h1>Still</h1>
        <div class="date" id="today-date"></div>
      </div>
      <a id="you-btn" class="you-btn" href="#you" data-tab="you" aria-label="You: settings, journal, data" hidden>You</a>
    </header>

    <main id="content" tabindex="-1"></main>

    <nav class="tabs" id="tabs" aria-label="Main" hidden>
      <a class="tab" href="#today" data-tab="today">Today</a>
      <a class="tab" href="#sleep" data-tab="sleep">Sleep</a>
      <a class="tab" href="#train" data-tab="train">Train</a>
      <a class="tab" href="#eat" data-tab="eat">Eat</a>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" id="sheet-body"></div>
  </div>
  <div id="session" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">Still needs JavaScript enabled.</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
